# __APP_SLUG__ — internal web app (starter: corp-webapp skill)
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "__HTTP_PORT__:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    build: .
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: __DB_NAME__
      MYSQL_USER: __DB_NAME__
      MYSQL_PASSWORD: __DB_PASSWORD__
      MYSQL_ROOT_PASSWORD: __DB_ROOT_PASSWORD__
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:__DB_PORT__:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p__DB_ROOT_PASSWORD__"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  mysql_data:
  vendor_data:
